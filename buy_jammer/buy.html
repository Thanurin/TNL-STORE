<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buy</title>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer&display=swap" rel="stylesheet">

    <link rel="icon" href="./img/6154600226237386998_121.jpg">

    <link rel="stylesheet" href="style4.css">

</head>

<body>
    <div id="complete">
        
        <form id="orderForm">
            <div>
                <p class="text">Facebook Name:</p>
                
                <input class="box" type="text" id="facebookName"placeholder="Your facebook name or telegram number">
                
                <p class="text">Phone Number:</p>
                
                <input class="box" type="text" id="phoneNumber"placeholder="Your phone number">
                <p class="location" id="Location">
                    Location:
                </p>
                
                <input class="box"type="text"lang="km" id="location" placeholder="Your location">
            </div>
            
            <p id="text">Type of Jammer:</p>
            
            <ul>
            <label>
                    <input type="checkbox" value="E32+E01 25$">
                            ESP32+E01 x1 25$
                    </label>
                </ul>
            <ul>
                <label>
                    <input type="checkbox" value="E32+E01(2) 38$">
                        ESP32+E01 x2 38$
                </label>
            </ul>
            
            <ul>
            <label>
                <input type="checkbox" value="E32+E01(3) 50$">
                    ESP32+E01 x3 50$
            </label>
        </ul>
            <ul>
                <label>
                    <input type="checkbox" value="E32+L01 15$">
                        ESP32+L01 x1 15$
                </label>
            </ul>
            
                <ul>
                    <label>
                        <input class="last" type="checkbox" value="E32+L01(2) 25$">
                        ESP32+L01 x2 25$
                    </label>
                </ul>
                <ul>
                    <label>
                        <input class="last" type="checkbox" value="E32+L01(3) 35$">
                        ESP32+L01 x3 35$
                    </label>
                </ul>
                <ul>
                    <label>
                        <input class="last" type="checkbox" value="E32+L01(4) 45$">
                        ESP32+L01 x4 45$
                    </label>
                </ul>
            
            <p id="delivery">Delivery By:</p>
            <label>
                <input type="checkbox" value="V&T">
                VET (2$)
            </label>
            
            <label>
                <input type="checkbox" value="J&T">
                J&T (2$)
            </label>
            
            <ul>
                <li>
                    QR-Code (Please send it to us with your own facebook account while you paid to us)
                </li>
            </ul>
            
            <img src="./img/qr.png" alt="QR" id="qr">
            <button type="submit" id="send">Send</button>
            <button type="button" id="back">Back</button>
        </form>

    </div>

    <script src="js4.js"></script>

</body>

</html>
